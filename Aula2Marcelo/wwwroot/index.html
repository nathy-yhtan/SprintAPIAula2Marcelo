<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- CSS do Bootstrap -->
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>

<body>

    <h1>Painel da Biblioteca</h1>

    <h2>Cadastrar um novo livro</h2>

    <div>

        <label for="">Auth JWT</label>

        <input type="text" id="input Token" placeholder="coloque seu token JWT aqui">

        <br>

        <button onclick="cadastrarLivros()" class="btn btn-primary">Cadastrar Livro</button>

        <br>

    </div>


    <section>

        <button onclick="carregarLivros()" class="btn btn-primary">Atualizar Livros</button>

        <table border="1">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Titulo</th>
                    <th>Autor</th>
                </tr>
            </thead>
            <tbody id="tabelaCorpo">
            </tbody>
        </table>

    </section>

    <script src="app.js"></script>

    <!-- JavaScript Bundle do Bootstrap (inclui Popper) -->
    <script src="https://jsdelivr.net"></script>
</body>

</html>
